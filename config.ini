; 日常修改参数只需编辑本文件，保存后重启接收程序。
; 正常使用：start_backend_receiver.cmd；只检查配置：check_config.cmd。
; 中文注释请保留 UTF-8 编码。密码仍在启动时输入，不写在这里。

[backend]
; 后端服务器根地址。换后端 IP 时改这里；不要追加 /gate/entry 或 /gate/exit。
url = http://192.168.110.166:83

[receiver]
; 监听本机全部 IPv4 网卡，通常不需要修改。
host = 0.0.0.0
; 相机上报端口。改动后也要同步修改两台相机的 HTTP POST 配置。
port = 8080
; 本机管理端口，仅允许从接收电脑的 127.0.0.1 访问。
api_port = 18081
; 接收电脑连接相机的网卡 IP，仅用于打印相机应该填写的地址。
; 此项不会修改电脑网卡或相机设置。接收电脑换 IP 时，要同时修改相机配置。
; 不确定时可留空，程序将提示使用接收电脑的实际 IP。
advertised_host = 192.168.55.101
; 内部处理时间预算，单位秒，允许 1 到 30。通常保持 6。
processing_budget = 6

[cameras]
; 设备 ID 与网络 IP 不同，换网络通常不需要修改设备 ID。
entry_id = 1803002542bd
exit_id = 18030025462d

[mysql]
; 127.0.0.1 表示接收电脑上的 MySQL，与上面的计费后端服务器是两回事。
host = 127.0.0.1
port = 3306
database = parking
user = parking_writer
; user 留空表示改用本地 SQLite 保存采集记录；正常测试请保持现有值。

[voice]
; 仅在允许开闸的本次 HTTP 回复中携带 0x22 播报；false 可关闭语音，保留原有开闸。
enabled = true
; 未加密控制卡的 RS485 地址，十进制。调试工具显示 100，对应十六进制 64。
; 两台相机各自连接控制卡，地址可以相同；这不是相机 IP，也不是 COM 口编号。
entry_address = 100
exit_address = 100
; none = 只读车牌；welcome = 车牌后加“欢迎光临”；goodbye = 车牌后加“一路平安”。
; 这里不能直接填写任意中文句子。默认先只读车牌，便于分别测试入口和出口。
entry_suffix = none
exit_suffix = none
; 保持已调通的相机/控制卡串口设置。程序不设置音量、波特率、广告或屏显协议。
; 修改后运行 check_config.cmd 检查，再重启 start_backend_receiver.cmd。
